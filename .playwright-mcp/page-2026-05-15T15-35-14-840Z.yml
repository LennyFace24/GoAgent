                - generic [ref=e1442]: "tool_name: str, tool_input: dict"
                - text: ") -> dict: # 1. deny rules for rule in deny_rules: if matches(rule, tool_name, tool_input): return {\"behavior\": \"deny\", \"reason\": \"matched deny rule\"} # 2. mode if mode == \"plan\" and tool_name in WRITE_TOOLS: return {\"behavior\": \"deny\", \"reason\": \"plan mode blocks writes\"} if mode == \"auto\" and tool_name in READ_ONLY_TOOLS: return {\"behavior\": \"allow\", \"reason\": \"auto mode allows reads\"} # 3. allow rules for rule in allow_rules: if matches(rule, tool_name, tool_input): return {\"behavior\": \"allow\", \"reason\": \"matched allow rule\"} # 4. fallback return {\"behavior\": \"ask\", \"reason\": \"needs confirmation\"}"
