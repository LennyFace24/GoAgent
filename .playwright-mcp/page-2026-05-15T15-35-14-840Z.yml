            - heading "先解释几个名词" [level=2] [ref=e1343]
            - heading "什么是权限系统" [level=3] [ref=e1344]
            - paragraph [ref=e1345]: 权限系统不是“有没有权限”这样一个布尔值。
            - paragraph [ref=e1346]: 它更像一条管道，用来回答：
            - list [ref=e1347]:
              - listitem [ref=e1348]: 这次调用要不要直接拒绝？
              - listitem [ref=e1349]: 能不能自动放行？
              - listitem [ref=e1350]: 剩下的要不要问用户？
            - heading "什么是权限模式" [level=3] [ref=e1351]
            - paragraph [ref=e1352]: 权限模式是系统当前的总体风格。
            - paragraph [ref=e1353]: 例如：
            - list [ref=e1354]:
              - listitem [ref=e1355]: 谨慎一点：大多数操作都问用户
              - listitem [ref=e1356]: 保守一点：只允许读，不允许写
              - listitem [ref=e1357]: 流畅一点：简单安全的操作自动放行
            - heading "什么是规则" [level=3] [ref=e1358]
            - paragraph [ref=e1359]: 规则就是“遇到某种工具调用时，该怎么处理”的小条款。
            - paragraph [ref=e1360]: 最小规则通常包含三部分：
            - generic [ref=e1361]:
              - text: python
              - code [ref=e1362]: "{ \"tool\": \"bash\", \"content\": \"sudo *\", \"behavior\": \"deny\", }"
            - paragraph [ref=e1363]: 意思是：
            - list [ref=e1364]:
              - listitem [ref=e1365]:
                - text: 针对
                - code [ref=e1366]: bash
              - listitem [ref=e1367]:
                - text: 如果命令内容匹配
                - code [ref=e1368]: sudo *
              - listitem [ref=e1369]: 就拒绝
            - heading "最小权限系统应该长什么样" [level=2] [ref=e1370]
            - paragraph [ref=e1371]: 如果你是从 0 开始手写，一个最小但正确的权限系统只需要四步：
            - generic [ref=e1372]:
              - text: text
              - code [ref=e1373]: tool_call | v 1. deny rules -> 命中了就拒绝 | v 2. mode check -> 根据当前模式决定 | v 3. allow rules -> 命中了就放行 | v 4. ask user -> 剩下的交给用户确认
            - paragraph [ref=e1374]: 这四步已经能覆盖教学仓库 80% 的核心需要。
            - heading "为什么顺序是这样" [level=2] [ref=e1375]
            - heading "第 1 步先看 deny rules" [level=3] [ref=e1376]
            - paragraph [ref=e1377]: 因为有些东西不应该交给“模式”去决定。
            - paragraph [ref=e1378]: 比如：
            - list [ref=e1379]:
              - listitem [ref=e1380]: 明显危险的命令
              - listitem [ref=e1381]: 明显越界的路径
            - paragraph [ref=e1382]: 这些应该优先挡掉。
            - heading "第 2 步看 mode" [level=3] [ref=e1383]
            - paragraph [ref=e1384]: 因为模式决定当前会话的大方向。
