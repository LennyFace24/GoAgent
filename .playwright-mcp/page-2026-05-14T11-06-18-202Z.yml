            - heading "What You'll Learn" [level=2] [ref=e255]
            - list [ref=e256]:
              - listitem [ref=e257]: Why long sessions inevitably run out of context space, and what happens when they do
              - listitem [ref=e258]: "A four-lever compression strategy: persisted output, micro-compact, auto-compact, and manual compact"
              - listitem [ref=e259]: How to move detail out of active memory without losing it
              - listitem [ref=e260]: How to keep a session alive indefinitely by summarizing and continuing
            - paragraph [ref=e261]: Your agent from s05 is capable. It reads files, runs commands, edits code, and delegates subtasks. But try something ambitious -- ask it to refactor a module that touches 30 files. After reading all of them and running 20 shell commands, you will notice the responses get worse. The model starts forgetting what it already read. It repeats work. Eventually the API rejects your request entirely. You have hit the context window limit, and without a plan for that, your agent is stuck.
            - heading "The Problem" [level=2] [ref=e262]
            - paragraph [ref=e263]:
              - text: "Every API call to the model includes the entire conversation so far: every user message, every assistant response, every tool call and its result. The model's context window (the total amount of text it can hold in working memory at once) is finite. A single"
              - code [ref=e264]: read_file
              - text: on a 1000-line source file costs roughly 4,000 tokens (roughly word-sized pieces -- a 1,000-line file uses about 4,000 tokens). Read 30 files and run 20 bash commands, and you have burned through 100,000+ tokens. The context is full, but the work is only half done.
            - paragraph [ref=e265]: "The naive fix -- just truncating old messages -- throws away information the agent might need later. A smarter approach compresses strategically: keep the important bits, move the bulky details to disk, and summarize when the conversation gets too long. That is what this chapter builds."
            - heading "The Solution" [level=2] [ref=e266]
            - paragraph [ref=e267]: We use four levers, each working at a different stage of the pipeline, from output-time filtering to full conversation summarization.
            - code [ref=e269]: "Every tool call: +------------------+ | Tool call result | +------------------+ | v [Lever 0: persisted-output] (at tool execution time) Large outputs (>50KB, bash >30KB) are written to disk and replaced with a <persisted-output> preview marker. | v [Lever 1: micro_compact] (silent, every turn) Replace tool_result > 3 turns old with \"[Previous: used {tool_name}]\" (preserves read_file results as reference material) | v [Check: tokens > 50000?] | | no yes | | v v continue [Lever 2: auto_compact] Save transcript to .transcripts/ LLM summarizes conversation. Replace all messages with [summary]. | v [Lever 3: compact tool] Model calls compact explicitly. Same summarization as auto_compact."
            - heading "How It Works" [level=2] [ref=e270]
            - 'heading "Step 1: Lever 0 -- Persisted Output" [level=3] [ref=e271]'
            - paragraph [ref=e272]: The first line of defense runs at tool execution time, before a result even enters the conversation. When a tool result exceeds a size threshold, we write the full output to disk and replace it with a short preview. This prevents a single giant command output from consuming half the context window.
            - generic [ref=e273]:
              - text: python
              - code [ref=e274]:
                - text: "PERSIST_OUTPUT_TRIGGER_CHARS_DEFAULT = 50000 PERSIST_OUTPUT_TRIGGER_CHARS_BASH = 30000 # bash uses a lower threshold def maybe_persist_output("
                - generic [ref=e275]: tool_use_id, output, trigger_chars=None
                - text: "): if len(output) <= trigger: return output # small enough -- keep inline stored_path = _persist_tool_result(tool_use_id, output) return _build_persisted_marker(stored_path, output) # swap in a compact preview # Returns: <persisted-output> # Output too large (48.8KB). Full output saved to: .task_outputs/tool-results/abc123.txt # Preview (first 2.0KB): # ... first 2000 chars ... # </persisted-output>"
            - paragraph [ref=e276]:
              - text: The model can later
