            - paragraph [ref=e348]: "At this point, you can:"
            - list [ref=e349]:
              - listitem [ref=e350]: Explain why a long agent session degrades and eventually fails without compression
              - listitem [ref=e351]: Intercept oversized tool outputs before they enter the context window
              - listitem [ref=e352]: Silently replace stale tool results with lightweight placeholders each turn
