# 对话模型配置位于 model.json；embedding 配置仍由本文件加载。
server:
    host: 0.0.0.0
    port: 8080
embedding:
    base_url: https://your-embedding.com/v1
    api_key: your-api-key
    model: your-embedding-model
chromadb:
    url: http://chromadb:8088
session:
    secret_key: session-secret
sandbox:
    endpoint: http://localhost:8081