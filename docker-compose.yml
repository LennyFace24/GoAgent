services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "80:8080"
      - "8080:8080"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - type: bind
        source: ./model.json
        target: /app/model.json
        read_only: true
        bind:
          create_host_path: false
      - goagent-data:/app/data
    depends_on:
      - chromadb

  chromadb:
    build: ./chroma
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - chroma-data:/app/chroma_data

volumes:
  goagent-data:
  chroma-data:
