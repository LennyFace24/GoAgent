services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - ./internal/skills:/app/internal/skills:ro
      - goagent-data:/app/data
    depends_on:
      - chromadb
      - prometheus

  chromadb:
    build: ./chroma
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - chroma-data:/app/chroma_data

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # node_exporter:
  #   image: prom/node-exporter:latest
  #   restart: unless-stopped
  #   ports:
  #     - "9100:9100"
  #   pid: host
  #   volumes:
  #     - /proc:/host/proc:ro
  #     - /sys:/host/sys:ro
  #     - /:/rootfs:ro
  #   command:
  #     - '--path.procfs=/host/proc'
  #     - '--path.sysfs=/host/sys'
  #     - '--path.rootfs=/rootfs'

volumes:
  goagent-data:
  chroma-data:
  prometheus-data:
